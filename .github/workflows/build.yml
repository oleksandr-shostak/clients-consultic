# build.yml

name: Auto Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release-test
    tags:
      - 'v*'  # 添加对标签的监听，所有以v开头的标签都会触发构建



env:
  ELECTRON_OUTPUT_PATH: interface/dist_electron
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}


jobs:
  release:
    name: build and release electron app
    runs-on: windows-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v3

      - uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: build go client
        run: make build-client
        working-directory: go-client

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
            node-version: '20.x'

      - name: Yarn install
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn global add xvfb-maybe
        working-directory: ui

      # Signing: use secrets-provided PFX (base64) and password if present
      # If you want unsigned builds, remove the env below and set CSC_IDENTITY_AUTO_DISCOVERY=false

      - name: Build app (no publish)
        shell: pwsh
        run: |
          yarn build
          npx electron-builder --win --publish never
        working-directory: ui

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-artifacts
          path: |
            ui/dist/**
          if-no-files-found: warn
