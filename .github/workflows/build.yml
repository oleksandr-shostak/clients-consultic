# build.yml

name: Auto Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release-test
    tags:
      - 'v*'  # 添加对标签的监听，所有以v开头的标签都会触发构建



env:
  ELECTRON_OUTPUT_PATH: interface/dist_electron
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}


jobs:
  release:
    name: build and release electron app
    runs-on: windows-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v3

      - uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: build go client
        run: make build-client
        working-directory: go-client

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
            node-version: '20.x'

      - name: Yarn install
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn global add xvfb-maybe
        working-directory: ui

      - name: Unset signing environment variables (Windows)
        shell: pwsh
        run: |
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue

      - name: Build  & release app (unsigned)
        shell: pwsh
        run: |
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          yarn build:win
        working-directory: ui

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-artifacts
          path: |
            ui/dist/**
          if-no-files-found: warn
